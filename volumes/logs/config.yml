api:
  enabled: true
  address: 0.0.0.0:9001

sources:
  docker_host:
    type: docker_logs
    exclude_containers:
      - supabase-vector

transforms:
  route_logs:
    type: route
    inputs: ["docker_host"]
    route:
      analytics: '.container_name == "supabase-analytics"'
      auth: '.container_name == "supabase-auth"'
      rest: '.container_name == "supabase-rest"'
      realtime: '.container_name == "supabase-realtime"'
      storage: '.container_name == "supabase-storage"'
      kong: '.container_name == "supabase-kong"'
      db: '.container_name == "supabase-db"'

sinks:
  logflare_analytics:
    type: http
    inputs: ["route_logs.analytics"]
    uri: http://analytics:4000/api/logs?source_name=analytics&api_key=${LOGFLARE_PUBLIC_ACCESS_TOKEN}
    method: post
    encoding:
      codec: json
    headers:
      Content-Type: "application/json"

  logflare_auth:
    type: http
    inputs: ["route_logs.auth"]
    uri: http://analytics:4000/api/logs?source_name=auth&api_key=${LOGFLARE_PUBLIC_ACCESS_TOKEN}
    method: post
    encoding:
      codec: json
    headers:
      Content-Type: "application/json"

  logflare_rest:
    type: http
    inputs: ["route_logs.rest"]
    uri: http://analytics:4000/api/logs?source_name=rest&api_key=${LOGFLARE_PUBLIC_ACCESS_TOKEN}
    method: post
    encoding:
      codec: json
    headers:
      Content-Type: "application/json"

  logflare_realtime:
    type: http
    inputs: ["route_logs.realtime"]
    uri: http://analytics:4000/api/logs?source_name=realtime&api_key=${LOGFLARE_PUBLIC_ACCESS_TOKEN}
    method: post
    encoding:
      codec: json
    headers:
      Content-Type: "application/json"

  logflare_storage:
    type: http
    inputs: ["route_logs.storage"]
    uri: http://analytics:4000/api/logs?source_name=storage&api_key=${LOGFLARE_PUBLIC_ACCESS_TOKEN}
    method: post
    encoding:
      codec: json
    headers:
      Content-Type: "application/json"

  logflare_kong:
    type: http
    inputs: ["route_logs.kong"]
    uri: http://analytics:4000/api/logs?source_name=kong&api_key=${LOGFLARE_PUBLIC_ACCESS_TOKEN}
    method: post
    encoding:
      codec: json
    headers:
      Content-Type: "application/json"

  logflare_db:
    type: http
    inputs: ["route_logs.db"]
    uri: http://analytics:4000/api/logs?source_name=db&api_key=${LOGFLARE_PUBLIC_ACCESS_TOKEN}
    method: post
    encoding:
      codec: json
    headers:
      Content-Type: "application/json"
