# Supabase 部署参数配置
# 用户在安装时可以配置这些参数

params:
  # 数据库密码
  - id: POSTGRES_PASSWORD
    type: string
    name: 数据库密码
    description: PostgreSQL 数据库的主密码，用于所有内部数据库连接
    optional: false
    default_value: "HGaQSGm95b7adrmrmsN7k3Ak+mv8656bwcCHzdZJjqI="
    hidden: true

  # JWT 密钥
  - id: JWT_SECRET
    type: string
    name: JWT 签名密钥
    description: 用于签名和验证 JWT tokens 的密钥
    optional: false
    default_value: "IRl9Nu7Iic88DHTtgs56JuKwkaqiZaV+QxVL6uW8g+Rd0Pyo9KDlhG8LWawtSJhXWffTw30mwl9Jsd0x0ZI6FA=="
    hidden: true

  # 匿名访问密钥
  - id: ANON_KEY
    type: string
    name: 匿名访问密钥
    description: 客户端公开使用的 API 密钥，具有匿名角色权限
    optional: false
    default_value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzYwMDk5MDIzLCJleHAiOjE5MTc3NzkwMjN9.8oD2zsy-8K6Se5D4lF0vxXfRKk5sDHJ5wVfXEtrPVCQ"
    hidden: true

  # 服务角色密钥
  - id: SERVICE_ROLE_KEY
    type: string
    name: 服务角色密钥
    description: 服务端使用的 API 密钥，具有完全访问权限，请妥善保管
    optional: false
    default_value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3NjAwOTkwMjMsImV4cCI6MTkxNzc3OTAyM30.8gS09SZUaUh8gjGBEl6QdUXXB8BYh_EVZmwbwubX6Ic"
    hidden: true

  # Logflare 公钥
  - id: LOGFLARE_PUBLIC_ACCESS_TOKEN
    type: string
    name: Logflare 公钥
    description: Analytics 服务的公共访问令牌
    optional: false
    default_value: "n+fsZzV7UrXx3a8ZeRofm0Xhry/AXXo7vyOMs9a6BD4="
    hidden: true

  # Logflare 私钥
  - id: LOGFLARE_PRIVATE_ACCESS_TOKEN
    type: string
    name: Logflare 私钥
    description: Analytics 服务的私有访问令牌
    optional: false
    default_value: "2czFheRqEgmweE/Oj9B+O1VFEYN3dgoSyENjDwzDIdXCTDGVuEXgEqEm3dHhmBrk"
    hidden: true

  # 基础密钥
  - id: SECRET_KEY_BASE
    type: string
    name: 基础密钥
    description: Realtime 和 Pooler 服务的基础加密密钥
    optional: false
    default_value: "y5ebTsCAkyC3Qi6/OVWQOh/DLsA/EqnRZMj1E7terg1gxkITj2vu+HkSTujjA+1sJBLwf/393BaMTa+bsi8aSg=="
    hidden: true

  # Vault 加密密钥
  - id: VAULT_ENC_KEY
    type: string
    name: Vault 加密密钥
    description: Pooler 服务的 Vault 加密密钥
    optional: false
    default_value: "dd5c19ffcb398a7c569ebb77592203b4"
    hidden: true

  # Kong Dashboard 用户名
  - id: DASHBOARD_USERNAME
    type: string
    name: Dashboard 用户名
    description: Kong 管理界面的登录用户名
    optional: false
    default_value: "supabase"
    hidden: false

  # Kong Dashboard 密码
  - id: DASHBOARD_PASSWORD
    type: string
    name: Dashboard 密码
    description: Kong 管理界面的登录密码，生产环境请务必修改,请勿设置纯数字
    optional: false
    default_value: "uAProK5hCAo5ynS8+N1fCFVaKHdFuwYT"
    hidden: false
