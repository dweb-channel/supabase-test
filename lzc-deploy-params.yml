# Supabase 部署参数配置
# 用户在安装时可以配置这些参数

params:
  # 数据库密码
  - id: POSTGRES_PASSWORD
    type: string
    name: 数据库密码
    description: PostgreSQL 数据库的主密码，用于所有内部数据库连接
    optional: false
    default_value: "HGaQSGm95b7adrmrmsN7k3Ak+mv8656bwcCHzdZJjqI="
    hidden: false

  # JWT 密钥
  - id: JWT_SECRET
    type: string
    name: JWT 签名密钥
    description: 用于签名和验证 JWT tokens 的密钥
    optional: false
    default_value: "qOn3h7eq3fSUibnC1gyfX0arV3bbYTGh2o/lxTVYOd3ExK98E9Iy4DUPxsnzdPGZqM1CqhcJ8TcB84P/eXLGlA=="
    hidden: true

  # 匿名访问密钥
  - id: ANON_KEY
    type: string
    name: 匿名访问密钥
    description: 客户端公开使用的 API 密钥，具有匿名角色权限
    optional: false
    default_value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzU5MzM3MDEzLCJleHAiOjE5MTcwMTcwMTN9.kRdvSunFmmaFdzMtp5TF12DmCfKWiVOT2wqRuo5eDSE"
    hidden: false

  # 服务角色密钥
  - id: SERVICE_ROLE_KEY
    type: string
    name: 服务角色密钥
    description: 服务端使用的 API 密钥，具有完全访问权限，请妥善保管
    optional: false
    default_value: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UiLCJpYXQiOjE3NTkzMzcwMTMsImV4cCI6MTkxNzAxNzAxM30.iPE8oKnBhwk3LEuuYUk-QpO6YKEjYyH2OwCpwmhwuNE"
    hidden: true

  # Logflare 公钥
  - id: LOGFLARE_PUBLIC_ACCESS_TOKEN
    type: string
    name: Logflare 公钥
    description: Analytics 服务的公共访问令牌
    optional: false
    default_value: "5gTe5JymVe2f4FUNadI+ftbfaNIo7R6Rffnk8xydaUo="
    hidden: true

  # Logflare 私钥
  - id: LOGFLARE_PRIVATE_ACCESS_TOKEN
    type: string
    name: Logflare 私钥
    description: Analytics 服务的私有访问令牌
    optional: false
    default_value: "HAognYF93gKOl8WKPpXoYK9oUThwLFJ2b9+jrTtBmz6ZhSV9eMneyGBhXfssE2Y0"
    hidden: true

  # 基础密钥
  - id: SECRET_KEY_BASE
    type: string
    name: 基础密钥
    description: Realtime 和 Pooler 服务的基础加密密钥
    optional: false
    default_value: "ItYWmA6pXL/7WlOggUo5kcGKGCDAUFfYbl8Tl+yK2y6O0SI5+m/lfXl+1SGCY7ScmVAAF2DEU1Of9/c8XFfFnQ=="
    hidden: true

  # Vault 加密密钥
  - id: VAULT_ENC_KEY
    type: string
    name: Vault 加密密钥
    description: Pooler 服务的 Vault 加密密钥
    optional: false
    default_value: "0b8bb54261952ee17ed5358a2e0cd50e"
    hidden: true
